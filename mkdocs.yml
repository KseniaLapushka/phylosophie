site_name: Конспекты по философии
site_description: Личные конспекты лекций — чтобы в любой момент открыть и вспомнить, что проходили
site_author: Ksu Solovey

site_url: https://KseniaLapushka.github.io/phylosophie/
repo_url: https://github.com/KseniaLapushka/phylosophie
repo_name: phylosophie

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Lora
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/answers.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: false
      title: На этой странице
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.mark
  - tables

plugins:
  - search:
      lang: ru

# nav можно не задавать вообще — MkDocs сам построит меню
# из структуры папок и файлов внутри docs/. Просто добавляй
# новые .md файлы в нужный курс — они появятся в навигации сами.
